milestone_due_dates:
  - id: "M01"
    week: 3
    day: "Monday"
    title: "Repository setup and workflow baseline"
    focus: "Git repository setup and reproducible project start"
    notes: "Used for Tuesday project review"
    required_items:
      - "Repository URL and active branch"
      - "README quickstart with run command"
      - "Environment setup evidence"
    rubric:
      - "Repository is cloneable and organized"
      - "Quickstart is accurate"
      - "Baseline reproducibility evidence provided"

  - id: "M02"
    week: 6
    day: "Monday"
    title: "Testing baseline and failure handling"
    focus: "Unit tests and basic reliability checks"
    notes: "Used for Tuesday project review"
    required_items:
      - "At least three tests including one failure case"
      - "Test run output"
      - "Short note on one bug found and fixed"
    rubric:
      - "Tests cover core behavior"
      - "Failure handling is demonstrated"
      - "Debugging note is clear and actionable"

  - id: "M03"
    week: 9
    day: "Monday"
    title: "Linting and code quality pass"
    focus: "Linting/formatting and maintainability improvements"
    notes: "Used for Tuesday project review"
    required_items:
      - "Lint configuration committed"
      - "Lint run evidence"
      - "One code quality refactor"
    rubric:
      - "Linting is configured and executable"
      - "Code quality issue was addressed"
      - "Refactor improves readability or structure"

  - id: "M04"
    week: 11
    day: "Monday"
    title: "Auto documentation and usage clarity"
    focus: "Docstrings and generated documentation"
    notes: "Used for Tuesday project review"
    required_items:
      - "Core functions documented"
      - "Generated docs artifact"
      - "One user-facing usage example"
    rubric:
      - "Docs are accurate and readable"
      - "Usage example is reproducible"
      - "Documentation supports handoff"

  - id: "M05"
    week: 13
    day: "Monday"
    title: "Release candidate and handoff package"
    focus: "Final integration, release readiness, and teammate handoff"
    notes: "Used for Tuesday project review"
    required_items:
      - "Tagged release candidate"
      - "Final run/check evidence"
      - "Handoff note for future teammate"
    rubric:
      - "Release candidate is complete"
      - "Quality evidence is credible"
      - "Handoff documentation is practical"
