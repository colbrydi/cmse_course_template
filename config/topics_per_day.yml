semester_info:
  name: "Fall 2026"
  term: "FS26"
  meeting_days:
    - "Tuesday"
    - "Thursday"

course_threads:
  - "Modeling fluency (physical, analytical, data-driven)"
  - "Software engineering practices (testing, modularity, version control, documentation)"
  - "Responsible AI workflow (generation, validation, trust calibration)"
  - "Reproducibility and handoff quality"

modules:
  Foundations and Workflow:
    order: 1
    focus: "Course framing, project setup, and AI trust habits"
    flexibility: "Low"
    learning_goals:
      - "Frame a research question that guides semester project decisions"
      - "Establish reproducible team workflow basics"
      - "Start evidence-based AI usage with tests"
  Analytical Modeling:
    order: 2
    focus: "Analytical modeling methods and interpretable computation"
    flexibility: "Medium"
    learning_goals:
      - "Use equations and symbolic tools as practical models"
      - "Connect optimization and discovery methods to research questions"
  Physical Modeling:
    order: 3
    focus: "Mechanistic simulation and verification"
    flexibility: "Medium"
    learning_goals:
      - "Build simulation workflows from assumptions to validated outputs"
      - "Practice verification and debugging in model pipelines"
  Data-Driven Modeling:
    order: 4
    focus: "Statistical learning, evaluation, and robustness"
    flexibility: "Medium"
    learning_goals:
      - "Compare data-driven approaches and justify model choices"
      - "Use reproducible experiments and evaluation practices"
  AI and Final Synthesis:
    order: 5
    focus: "Modern AI workflows and final project integration"
    flexibility: "High"
    learning_goals:
      - "Evaluate when AI methods are useful and where they fail"
      - "Present research software with a clear quality narrative"

studios:
  Studio01:
    title: "Reproducibility and Repository Baseline"
    required_artifact: "Repo setup log + working test run"
    optional_extension: "Environment troubleshooting notes for another machine"
    threads:
      - "Software engineering practices (testing, modularity, version control, documentation)"
      - "Reproducibility and handoff quality"
  Studio02:
    title: "Documentation, Testing, and AI Validation"
    required_artifact: "One AI-assisted function plus at least three tests"
    optional_extension: "Prompt-to-test trust log with one failure case"
    threads:
      - "Responsible AI workflow (generation, validation, trust calibration)"
      - "Software engineering practices (testing, modularity, version control, documentation)"
  Studio03:
    title: "Packaging and Reusable Interfaces"
    required_artifact: "Package/module update with clean import path"
    optional_extension: "Starter API usage example"
    threads:
      - "Software engineering practices (testing, modularity, version control, documentation)"
      - "Reproducibility and handoff quality"
  Studio04:
    title: "Verification, Validation, and Unit Testing"
    required_artifact: "Evidence of tests and one bug fix"
    optional_extension: "Failure case write-up"
    threads:
      - "Software engineering practices (testing, modularity, version control, documentation)"
      - "Reproducibility and handoff quality"
  Studio05:
    title: "Model Evaluation and Reproducibility Audit"
    required_artifact: "Evaluation summary and reproducibility check"
    optional_extension: "Cross-platform run notes"
    threads:
      - "Data-Driven Modeling"
      - "Reproducibility and handoff quality"
  Studio06:
    title: "AI-Assisted Development and Reflection"
    required_artifact: "AI workflow reflection tied to project decisions"
    optional_extension: "Comparison of AI-generated vs manually authored approach"
    threads:
      - "Responsible AI workflow (generation, validation, trust calibration)"
      - "Modeling fluency (physical, analytical, data-driven)"

